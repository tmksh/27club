    <script>
      // SP版以外はPC版レイアウトを見切れないように表示（zoomのみ）
      (function() {
        var PC_WIDTH = 1440;
        var SP_BREAKPOINT = 768;
        
        function updateZoom() {
          var width = window.innerWidth;
          var html = document.documentElement;
          
          if (width >= SP_BREAKPOINT && width < PC_WIDTH) {
            // タブレット: PC版レイアウトを縮小表示
            var zoom = width / PC_WIDTH;
            html.style.zoom = zoom;
            html.style.minWidth = PC_WIDTH + 'px';
            console.log('[Zoom] width:', width, 'zoom:', zoom.toFixed(3));
          } else if (width >= PC_WIDTH) {
            // PC: 通常表示
            html.style.zoom = '1';
            html.style.minWidth = '';
            console.log('[Zoom] PC full size, width:', width);
          } else {
            // SP: 通常のレスポンシブ表示
            html.style.zoom = '1';
            html.style.minWidth = '';
            console.log('[Zoom] SP layout, width:', width);
          }
        }
        
        // 初回実行
        updateZoom();
        
        // リサイズ時に更新
        window.addEventListener('resize', updateZoom);
      })();
    </script>

    <style>
      @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
      * {
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0px;
        height: 100%;
      }
      /* a blue color as a generic focus style */
      button:focus-visible {
        outline: 2px solid #4a90e2 !important;
        outline: -webkit-focus-ring-color auto 5px !important;
      }
      a {
        text-decoration: none;
      }

      /* ========================================
         Scroll Animations - Elegant & Smooth
         ======================================== */
      
      /* Base states for scroll animations */
      [data-scroll] {
        opacity: 0;
        transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      
      [data-scroll].animate-in {
        opacity: 1;
      }
      
      /* Fade Up */
      [data-scroll="fade-up"] {
        transform: translateY(60px);
      }
      [data-scroll="fade-up"].animate-in {
        transform: translateY(0);
      }
      
      /* Fade Down */
      [data-scroll="fade-down"] {
        transform: translateY(-60px);
      }
      [data-scroll="fade-down"].animate-in {
        transform: translateY(0);
      }
      
      /* Fade Left */
      [data-scroll="fade-left"] {
        transform: translateX(60px);
      }
      [data-scroll="fade-left"].animate-in {
        transform: translateX(0);
      }
      
      /* Fade Right */
      [data-scroll="fade-right"] {
        transform: translateX(-60px);
      }
      [data-scroll="fade-right"].animate-in {
        transform: translateX(0);
      }
      
      /* Scale Up */
      [data-scroll="scale-up"] {
        transform: scale(0.9);
      }
      [data-scroll="scale-up"].animate-in {
        transform: scale(1);
      }
      
      /* Scale Down */
      [data-scroll="scale-down"] {
        transform: scale(1.1);
      }
      [data-scroll="scale-down"].animate-in {
        transform: scale(1);
      }
      
      /* Zoom In */
      [data-scroll="zoom-in"] {
        transform: scale(0.8);
        filter: blur(5px);
      }
      [data-scroll="zoom-in"].animate-in {
        transform: scale(1);
        filter: blur(0);
      }
      
      /* Flip Up */
      [data-scroll="flip-up"] {
        transform: perspective(1000px) rotateX(30deg);
        transform-origin: center bottom;
      }
      [data-scroll="flip-up"].animate-in {
        transform: perspective(1000px) rotateX(0);
      }
      
      /* Slide Reveal */
      [data-scroll="reveal"] {
        clip-path: inset(0 100% 0 0);
      }
      [data-scroll="reveal"].animate-in {
        clip-path: inset(0 0 0 0);
      }
      
      /* Glow In */
      [data-scroll="glow"] {
        filter: brightness(0.5);
        text-shadow: none;
      }
      [data-scroll="glow"].animate-in {
        filter: brightness(1);
        text-shadow: 0 0 30px rgba(0, 201, 167, 0.5);
      }
      
      /* Stagger delays for children */
      [data-scroll-stagger] > *:nth-child(1) { transition-delay: 0ms; }
      [data-scroll-stagger] > *:nth-child(2) { transition-delay: 100ms; }
      [data-scroll-stagger] > *:nth-child(3) { transition-delay: 200ms; }
      [data-scroll-stagger] > *:nth-child(4) { transition-delay: 300ms; }
      [data-scroll-stagger] > *:nth-child(5) { transition-delay: 400ms; }
      [data-scroll-stagger] > *:nth-child(6) { transition-delay: 500ms; }
      [data-scroll-stagger] > *:nth-child(7) { transition-delay: 600ms; }
      [data-scroll-stagger] > *:nth-child(8) { transition-delay: 700ms; }
      [data-scroll-stagger] > *:nth-child(9) { transition-delay: 800ms; }
      [data-scroll-stagger] > *:nth-child(10) { transition-delay: 900ms; }
      [data-scroll-stagger] > *:nth-child(11) { transition-delay: 1000ms; }
      [data-scroll-stagger] > *:nth-child(12) { transition-delay: 1100ms; }
      
      /* Custom delays */
      [data-scroll-delay="100"] { transition-delay: 100ms; }
      [data-scroll-delay="200"] { transition-delay: 200ms; }
      [data-scroll-delay="300"] { transition-delay: 300ms; }
      [data-scroll-delay="400"] { transition-delay: 400ms; }
      [data-scroll-delay="500"] { transition-delay: 500ms; }
      [data-scroll-delay="600"] { transition-delay: 600ms; }
      [data-scroll-delay="700"] { transition-delay: 700ms; }
      [data-scroll-delay="800"] { transition-delay: 800ms; }
      
      /* Custom durations */
      [data-scroll-duration="fast"] { transition-duration: 0.4s; }
      [data-scroll-duration="slow"] { transition-duration: 1.2s; }
      [data-scroll-duration="slower"] { transition-duration: 1.6s; }

      /* Reduce motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        [data-scroll] {
          transition: opacity 0.3s ease;
          transform: none !important;
          filter: none !important;
          clip-path: none !important;
        }
      }
    </style>
