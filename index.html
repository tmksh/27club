<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anima Project - Automatically generated by Anima</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // SP版以外はPC版レイアウトを見切れないように表示（zoomのみ）
      (function() {
        var PC_WIDTH = 1440;
        var SP_BREAKPOINT = 768;
        
        function updateZoom() {
          var width = window.innerWidth;
          var html = document.documentElement;
          
          if (width >= SP_BREAKPOINT && width < PC_WIDTH) {
            // タブレット: PC版レイアウトを縮小表示
            var zoom = width / PC_WIDTH;
            html.style.zoom = zoom;
            html.style.minWidth = PC_WIDTH + 'px';
            console.log('[Zoom] width:', width, 'zoom:', zoom.toFixed(3));
          } else if (width >= PC_WIDTH) {
            // PC: 通常表示
            html.style.zoom = '1';
            html.style.minWidth = '';
            console.log('[Zoom] PC full size, width:', width);
          } else {
            // SP: 通常のレスポンシブ表示
            html.style.zoom = '1';
            html.style.minWidth = '';
            console.log('[Zoom] SP layout, width:', width);
          }
        }
        
        // 初回実行
        updateZoom();
        
        // リサイズ時に更新
        window.addEventListener('resize', updateZoom);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aguafina+Script&display=swap" rel="stylesheet">
    <style>
      @import url("https://fonts.googleapis.com/css?family=Playfair+Display:700,800,400|Inter:600,500,400,700|Noto+Sans+JP:900,400,500,700|Princess+Sofia:400|Noto+Serif+JP:900,600,500,400,700|Inder:400|Abril+Fatface:400|Shippori+Mincho:700,600,400|Ubuntu:400|Freehand:400");
      @font-face {
        font-family: "Abhaya Libre ExtraBold-Regular";
        src: url("https://anima-uploads.s3.amazonaws.com/projects/612cee6e7d4dd4a7d49e33de/fonts/abhayalibre-extrabold.ttf")
          format("truetype");
      }
    </style>
    <style>
      @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
      * {
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0px;
        height: 100%;
      }
      /* a blue color as a generic focus style */
      button:focus-visible {
        outline: 2px solid #4a90e2 !important;
        outline: -webkit-focus-ring-color auto 5px !important;
      }
      a {
        text-decoration: none;
      }
    </style>
    <link href="tailwind.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.jsx"></script>
  </body>
</html>
